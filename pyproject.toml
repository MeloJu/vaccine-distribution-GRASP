[project]
name = "busca-tabu-vacinacao"
version = "1.0.0"
description = "Busca Tabu para distribuição de recursos em campanhas municipais de vacinação"
authors = [
    {name = "Gabriel Ramalho Lima"},
    {name = "Juan Ayres Melo"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["tabu-search", "metaheuristics", "optimization", "vaccination"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.python]
version = "3.9"
